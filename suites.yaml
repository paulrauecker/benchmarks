# Benchmark suites. `limit`/`epochs` here are defaults; CLI flags override.
#
# Cost figures are per model on a mid-tier NON-REASONING model. A model emitting
# ~8k thinking tokens per sample costs roughly 10-20x these numbers, and the
# `math` suite is where that concentrates.

suites:
  # Config validation, not measurement. Proves endpoint/auth/template/sandbox
  # work before you spend real money. Run this against every new model first.
  smoke:
    description: "Config validation, ~$0.05/model, <2 min"
    limit: 20
    tasks: [ifeval, gpqa_diamond, humaneval]

  # Sandbox validation for every task that needs Docker. Not measurement --
  # limits are deliberately tiny. Two jobs:
  #   1. prove the Docker sandbox, images and scorers actually work before a
  #      long run discovers otherwise hours in;
  #   2. warm the expensive one-off setup, since ds1000 and bigcodebench build
  #      or pull their own images and scicode downloads a ~1GB test_data.h5.
  # Run this once after any Docker/flake change, and before timing anything.
  #
  # mbpp needs BOTH overrides pinned: it sets epochs: 5 inside its Task (with
  # pass@k reducers) so a limit of 2 is really 10 generations, and its task
  # signature defaults temperature=0.5, which is a sampling override living
  # outside the registry -- exactly the kind of per-task drift models.yaml
  # exists to prevent. Harmless here because this suite never measures
  # anything, but don't copy mbpp into a scoring suite without dealing with it.
  #
  # scicode's limit counts main problems, each looping generate once per
  # subproblem (mean 4.48, max 15), so even limit: 1 is a handful of calls.
  smoke_code:
    description: "Docker sandbox validation + cache warm-up, all code tasks"
    tasks:
      - {task: humaneval, limit: 2}
      - {task: mbpp, limit: 2, epochs: 1}
      - {task: ds1000, limit: 2, args: {shuffle: false}}
      - {task: bigcodebench, limit: 2}
      - {task: scicode, limit: 1}

  core:
    description: "Cheap high-signal screen, ~$1/model, ~15 min"
    tasks:
      - ifeval                        # 541, programmatic scoring, no judge
      - gpqa_diamond                  # 198, graduate physics/chem/bio
      # shuffle: false -> seeded selection via run.py; see the `math` note below.
      - {task: mmlu_pro, limit: 1000, args: {shuffle: false}}  # subsampled from 12k

  math:
    description: "~$1/model non-reasoning, $20+ on reasoning models"
    tasks:
      # inspect_evals' math task has no built-in cap -- its dataset is the
      # full 5,000-sample MATH test split, not MATH-500. Cap explicitly or
      # this task alone can run 24+ hours on a slow backend.
      # shuffle: false -> use run.py's seeded sample_shuffle instead of this
      # task's unseeded one, so every model is scored on the same 500 items.
      - {task: math, limit: 500, args: {shuffle: false}}
      # 30 items/year: one problem is 3.3pp, so epochs are mandatory
      - {task: aime2025, epochs: 4}

  code:
    description: "~$1/model, requires Docker"
    tasks: [humaneval, mbpp]

  custom:
    description: "Your workflows. The uncontaminated signal."
    tasks: [extraction, physics_qa, code_tasks, agentic]

  core_math:
    description: "core + math only, no code/custom"
    includes: [core, math]

  # Sized for DISCRIMINATION, not for a round number of hours: the point is
  # to separate models and thinking levels, which needs enough n per task to
  # resolve ~10pp. Budget ~3h at reasoning_effort: medium (~9700s usable
  # after ~10% dataset-load/scoring overhead).
  #
  # Rates measured on ServerS (see docs/measurements.md): ~29 tok/s aggregate
  # over 4 slots -> ~37s per short-output sample, ~110s per gpqa_diamond
  # generation (gpqa hits the 8192 cap, so it costs ~3x a normal sample).
  #
  #   math          80 x  37s = 2960s
  #   scicode       15 x 185s = 2775s  (15 problems x ~4.48 subproblems)
  #   gpqa_diamond  25 x 110s = 2750s
  #   ds1000        35 x  35s = 1225s
  #   mmlu_pro      20 x  37s =  740s
  #   ifeval        10 x  37s =  370s
  #                            ------
  #                            10820s (~3h00m at medium effort)
  #
  # scicode's 185s/problem is DERIVED (4.48 subproblems x ~41s), not measured
  # -- it is the one task here with no live timing behind it, and the
  # accumulating conversation means later subproblems carry longer prompts,
  # so it may well run slower than this. Measure it on the first real run.
  #
  # Weighting is deliberate. ~78% of the budget goes to the three tasks where
  # reasoning effort actually changes the answer (math, scicode,
  # gpqa_diamond), since those are what separate thinking levels. scicode is
  # weighted up because it is the closest thing here to the actual target
  # domain (scientific computing) -- and because its headline metric is
  # per-MAIN-PROBLEM, so a small limit makes that metric meaningless no matter
  # how many subproblem generations it racks up. mmlu_pro/ds1000/ifeval are
  # there for breadth -- to catch a model broken somewhere unexpected -- not
  # to be finely resolved.
  #
  # What this can and cannot resolve (see the power table in
  # docs/measurements.md):
  #   math @ n=80 paired      -> ~11-13pp. Good enough to rank thinking levels.
  #   scicode subproblems     -> ~67 generations from 15 problems: ~13pp.
  #                              Its main-problem metric is only n=15 (~31pp),
  #                              so read the SUBPROBLEM metric for ranking and
  #                              treat the headline percentage as directional.
  #   gpqa_diamond @ n=25     -> ~25pp. On-target but expensive; treat as
  #                              directional unless the gap is large.
  #   the rest @ n=10-35      -> coarse. Sanity checks, not rankings.
  # Comparisons are PAIRED (run.py pins sample_shuffle, and math/mmlu_pro/
  # ds1000 get shuffle: false), so every model and effort level sees the same
  # items -- that pairing is what makes these numbers usable at all.
  #
  # RUNTIME VARIES SHARPLY BY EFFORT LEVEL. The estimate above is for medium.
  # reasoning_effort: none runs several times faster; xhigh runs several times
  # slower (measured on proteus: unset/unconstrained was ~8x `none` on
  # gpqa_diamond alone). Budget accordingly when sweeping levels.
  #
  # gpqa_diamond needs epochs: 1 SPELLED OUT -- inspect_evals bakes
  # DEFAULT_EPOCHS = 4 into the task, so omitting it silently quadruples it.
  # mbpp hides epochs: 5 the same way, hence its exclusion.
  #
  # humaneval and mbpp are excluded from measurement entirely: both returned
  # 1.000, and a benchmark at ceiling cannot resolve a difference at any
  # sample size. humaneval stays in `smoke`, proving the sandbox works.
  #
  # aime2025 is excluded: only 30 items exist, so even the full set gives
  # ~+/-20pp. Run the `math` suite when you want a real AIME number.
  #
  # CAVEAT: rates were measured at temperature 0 (greedy). The Qwen3.8 models
  # now use their model-card thinking-mode params (temp 1.0), which may shift
  # generation lengths and therefore these timings.
  compare3h:
    description: "~3h representative screen, sized to separate models and thinking levels"
    tasks:
      # args: {shuffle: false} disables each task's own UNSEEDED dataset
      # shuffle so run.py's seeded sample_shuffle picks the items. Without it
      # every model draws a different random subsample and the comparison is
      # no longer paired. gpqa_diamond, ifeval and scicode don't shuffle.
      #
      # scicode's limit counts MAIN PROBLEMS; each loops `generate` once per
      # subproblem (mean 4.48, median 3, max 15), so limit: 15 is ~67
      # generations and an unlucky draw costs ~5x a median one.
      #
      # NOTE: ds1000 builds its own Docker image and scicode downloads a ~1GB
      # test_data.h5 on first run -- warm both once before timing anything.
      - {task: math, limit: 80, args: {shuffle: false}}
      - {task: scicode, limit: 15}
      - {task: gpqa_diamond, limit: 25, epochs: 1}
      - {task: ds1000, limit: 35, args: {shuffle: false}}
      - {task: mmlu_pro, limit: 20, args: {shuffle: false}}
      - {task: ifeval, limit: 10}

  # SciCode on its own, for when you want a real number rather than the
  # token slot compare3h can afford. Full 65-problem set = ~291 generations;
  # at ~29 tok/s that is roughly 3-4h on the ServerS box.
  # Needs `gdown` (its test data is on Google Drive) and downloads a ~1GB
  # test_data.h5 on first run.
  scicode_full:
    description: "Full SciCode, ~3-4h on a ~29 tok/s box"
    tasks: [scicode]

  all:
    description: "Everything"
    includes: [core, math, code, custom]

# Maps suite task names to their inspect_evals import paths. Custom tasks
# resolve to llm_bench.tasks instead.
# Values are inspect_ai's REGISTERED task names (package/task_fn, via the
# @task decorator's registry_info().name) -- NOT python module import paths.
# Confirmed against installed inspect_evals: registry_info(ifeval).name ==
# "inspect_evals/ifeval", etc.
registry:
  ifeval:       inspect_evals/ifeval
  gpqa_diamond: inspect_evals/gpqa_diamond
  mmlu_pro:     inspect_evals/mmlu_pro
  math:         inspect_evals/math
  aime2025:     inspect_evals/aime2025
  humaneval:    inspect_evals/humaneval
  mbpp:         inspect_evals/mbpp
  ds1000:       inspect_evals/ds1000
  scicode:      inspect_evals/scicode
  bigcodebench: inspect_evals/bigcodebench
  extraction:   llm_bench/extraction
  physics_qa:   llm_bench/physics_qa
  code_tasks:   llm_bench/code_tasks
  agentic:      llm_bench/agentic
