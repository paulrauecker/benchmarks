# Benchmark suites. `limit`/`epochs` here are defaults; CLI flags override.
#
# Cost figures are per model on a mid-tier NON-REASONING model. A model emitting
# ~8k thinking tokens per sample costs roughly 10-20x these numbers, and the
# `math` suite is where that concentrates.

suites:
  # Config validation, not measurement. Proves endpoint/auth/template/sandbox
  # work before you spend real money. Run this against every new model first.
  smoke:
    description: "Config validation, ~$0.05/model, <2 min"
    limit: 20
    tasks: [ifeval, gpqa_diamond, humaneval]

  core:
    description: "Cheap high-signal screen, ~$1/model, ~15 min"
    tasks:
      - ifeval                        # 541, programmatic scoring, no judge
      - gpqa_diamond                  # 198, graduate physics/chem/bio
      # shuffle: false -> seeded selection via run.py; see the `math` note below.
      - {task: mmlu_pro, limit: 1000, args: {shuffle: false}}  # subsampled from 12k

  math:
    description: "~$1/model non-reasoning, $20+ on reasoning models"
    tasks:
      # inspect_evals' math task has no built-in cap -- its dataset is the
      # full 5,000-sample MATH test split, not MATH-500. Cap explicitly or
      # this task alone can run 24+ hours on a slow backend.
      # shuffle: false -> use run.py's seeded sample_shuffle instead of this
      # task's unseeded one, so every model is scored on the same 500 items.
      - {task: math, limit: 500, args: {shuffle: false}}
      # 30 items/year: one problem is 3.3pp, so epochs are mandatory
      - {task: aime2025, epochs: 4}

  code:
    description: "~$1/model, requires Docker"
    tasks: [humaneval, mbpp]

  custom:
    description: "Your workflows. The uncontaminated signal."
    tasks: [extraction, physics_qa, code_tasks, agentic]

  core_math:
    description: "core + math only, no code/custom"
    includes: [core, math]

  # Time-boxed to ~2h on the ServerS box (Qwen3.8-Flash-Next, 4 slots).
  #
  # Sizing is derived from a measured 10-sample-per-task probe on that box:
  # clean aggregate throughput is ~29 tok/s across 4 slots (~8.3/slot, which
  # matches llama-server's own `tg` figure), giving ~37s per short-output
  # sample and ~110s per gpqa_diamond generation (gpqa genuinely hits the
  # 8192 max_tokens cap, so it costs ~3x a normal sample).
  #
  # Budget: 7200s minus ~10% for dataset load/scoring/startup = ~6500s.
  #   gpqa_diamond  15 x 110s = 1650s
  #   scicode        8 x 185s = 1480s  (8 problems x ~4.48 subproblems)
  #   math          30 x  37s = 1110s
  #   ds1000        25 x  35s =  875s
  #   mmlu_pro      20 x  37s =  740s
  #   ifeval        15 x  37s =  555s
  #                            ------
  #                             6410s (~1h47m, leaving headroom)
  #
  # WARNING: six tasks inside a fixed 2h budget means every one of them is
  # small. Per-task this resolves only very large gaps (see the power table
  # in docs/measurements.md) -- it is a "does anything look broken / roughly
  # where does this model sit" screen, NOT a tool for ranking close models.
  # For a real number on any single task, run that task's own suite.
  #
  # Weighted toward math/physics. epochs are pinned to 1 everywhere: repeating
  # the same item only reduces generation noise, while more unique items also
  # reduces item-difficulty variance -- strictly the better buy when the pool
  # is bigger than what we're sampling (it is, for all four of these).
  #
  # gpqa_diamond needs epochs: 1 SPELLED OUT -- inspect_evals bakes
  # DEFAULT_EPOCHS = 4 into the task itself, so omitting it silently
  # quadruples the task to 80 generations and blows the whole budget on one
  # task. mbpp hides epochs: 5 the same way (hence its exclusion); the rest
  # of the tasks used here default to 1.
  #
  # aime2025 is deliberately excluded: only 30 items exist, and at any n this
  # budget affords the error bar is ~+/-20pp, i.e. no decision-relevant
  # information. Run the full `math` suite when you want a real AIME number.
  #
  # CAVEAT: the probe ran at temperature 0 (greedy). The Qwen3.8 models now
  # use their model-card thinking-mode params (temp 1.0), which may change
  # generation lengths and therefore these timings.
  quick2h:
    description: "~2h time-boxed screen on a ~29 tok/s self-hosted box"
    tasks:
      # args: {shuffle: false} on math/mmlu_pro/ds1000 disables their own
      # UNSEEDED dataset shuffle so run.py's seeded sample_shuffle picks the
      # items -- without it each model would be scored on a different random
      # subsample. gpqa_diamond and ifeval don't shuffle samples at all.
      #
      # ds1000 (numpy/pandas/scipy/matplotlib, execution-scored) is the coding
      # slot. humaneval and mbpp are deliberately NOT here: both returned
      # 1.000, and a benchmark at ceiling cannot resolve a difference at any
      # sample size. mbpp additionally hides epochs: 5 (pass@k reducers), so
      # it costs 5x what its limit suggests. humaneval stays in `smoke`, where
      # its job is proving the sandbox works rather than measuring anything.
      #
      # ifeval is trimmed hard: both boxes score 0.84-0.96, so it's near
      # ceiling and unlikely to resolve anything, but it's cheap and the only
      # programmatic no-judge signal here.
      #
      # NOTE: ds1000 builds its own Docker image on first run -- budget extra
      # time for that once.
      # scicode: limit is in MAIN PROBLEMS, and each one loops `generate` once
      # per subproblem (mean 4.48, median 3, max 15 across the 65-problem set),
      # so limit: 8 is ~36 generations, not 8. Subproblems are sequential
      # within a problem and the conversation accumulates, so prompts grow as
      # it goes. Cost is also variable: drawing a 15-subproblem item costs ~5x
      # a median one.
      - {task: gpqa_diamond, limit: 15, epochs: 1}
      - {task: scicode, limit: 8}
      - {task: math, limit: 30, args: {shuffle: false}}
      - {task: ds1000, limit: 25, args: {shuffle: false}}
      - {task: mmlu_pro, limit: 20, args: {shuffle: false}}
      - {task: ifeval, limit: 15}

  # SciCode on its own, for when you want a real number rather than the
  # token slot quick2h can afford. Full 65-problem set = ~291 generations;
  # at ~29 tok/s that is roughly 3-4h on the ServerS box.
  # Needs `gdown` (its test data is on Google Drive) and downloads a ~1GB
  # test_data.h5 on first run.
  scicode_full:
    description: "Full SciCode, ~3-4h on a ~29 tok/s box"
    tasks: [scicode]

  all:
    description: "Everything"
    includes: [core, math, code, custom]

# Maps suite task names to their inspect_evals import paths. Custom tasks
# resolve to llm_bench.tasks instead.
# Values are inspect_ai's REGISTERED task names (package/task_fn, via the
# @task decorator's registry_info().name) -- NOT python module import paths.
# Confirmed against installed inspect_evals: registry_info(ifeval).name ==
# "inspect_evals/ifeval", etc.
registry:
  ifeval:       inspect_evals/ifeval
  gpqa_diamond: inspect_evals/gpqa_diamond
  mmlu_pro:     inspect_evals/mmlu_pro
  math:         inspect_evals/math
  aime2025:     inspect_evals/aime2025
  humaneval:    inspect_evals/humaneval
  mbpp:         inspect_evals/mbpp
  ds1000:       inspect_evals/ds1000
  scicode:      inspect_evals/scicode
  bigcodebench: inspect_evals/bigcodebench
  extraction:   llm_bench/extraction
  physics_qa:   llm_bench/physics_qa
  code_tasks:   llm_bench/code_tasks
  agentic:      llm_bench/agentic
