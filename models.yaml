# Model registry. This is the single place generation settings live, so that a
# self-hosted model and an OpenRouter model receive byte-identical treatment.
# Never override these in per-task code.

defaults:
  temperature: 0.0
  max_tokens: 4096
  max_connections: 8
  logprobs: false

# Pinned judge for model-graded scoring. One judge for all runs keeps the
# self-preference bias constant; the harness refuses to let a model judge itself.
judge: openrouter/anthropic/claude-sonnet-4.5
judge_cost: {input: 3.00, output: 15.00}  # USD per 1M tokens, Anthropic list price

models:
  qwen3-32b-vllm:
    spec: openai-api/homelab/Qwen3-32B
    cost: {input: 0.0, output: 0.0}   # self-hosted -> $0, keeps cost math honest
    max_connections: 16
    logprobs: true                    # -> confidence/ECE columns in the report

  qwen3-32b-llamacpp:
    spec: openai-api/llamacpp/Qwen3-32B-Q5_K_M
    cost: {input: 0.0, output: 0.0}
    max_connections: 4                # MUST be <= llama-server --parallel
    logprobs: true
    server:                           # documentation, not applied by the harness;
      parallel: 4                     # recorded so a score is explainable later
      ctx_size: 32768                 # = 8192 usable per slot x 4 slots

  # Live test box: servers.cougar-diatonic.ts.net:8080, /props reports
  # total_slots=4, n_ctx=16384 -> 4096 usable tokens/slot.
  qwen3.8-flash-cougar:
    spec: openai-api/llamacpp/Qwen3.8-Flash-Next
    cost: {input: 0.0, output: 0.0}
    max_tokens: 1024                  # well under the 4096/slot budget
    max_connections: 4                # == total_slots
    logprobs: true
    quant: UD-Q4_K_XL                 # from /v1/models model id; /props.meta.ftype
                                       # only reports the coarser "Q4_K - Medium"
    server:
      parallel: 4
      ctx_size: 16384

  qwen3-max:
    spec: openrouter/qwen/qwen3-max
    cost: {input: 1.25, output: 6.00} # USD per 1M tokens
    max_connections: 8
    logprobs: false                   # ~77% of OpenRouter endpoints lack support

  gpt-5-mini:
    spec: openrouter/openai/gpt-5-mini
    cost: {input: 0.25, output: 2.00}
    max_tokens: 16384                 # reasoning models need headroom
    max_connections: 8

  nemotron-3-super-free:
    spec: openrouter/nvidia/nemotron-3-super-120b-a12b:free
    cost: {input: 0.0, output: 0.0}    # :free tier
    max_tokens: 16384                  # reasoning model (medium effort by default)
    max_connections: 2                 # free-tier endpoints rate-limit hard
    logprobs: false                    # :free variant's supported_parameters omits logprobs

  minimax-m3-free:
    spec: openrouter/minimax/minimax-m3:free
    cost: {input: 0.0, output: 0.0}   # :free tier
    max_tokens: 16384                 # reasoning model, needs headroom
    max_connections: 2                # free-tier endpoints rate-limit hard
    logprobs: false
