[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark harness for self-hosted and OpenRouter models"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.60",
    "openai>=1.0",  # required by inspect_ai's openai-api provider, used for
                    # OpenRouter, vLLM, and llama.cpp alike
    "inspect-evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals",
    # IFEval's scorer needs this; inspect_evals doesn't pull it in by default.
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# lm-eval kept available as an independent cross-check when an Inspect score
# looks wrong; see "Why not the alternatives" in the plan.
crosscheck = ["lm-eval>=0.4.9"]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.hatch.metadata]
allow-direct-references = true
