[project]
name = "llm-bench"
version = "0.1.0"
description = "Benchmark harness for self-hosted and OpenRouter models"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.60",
    "openai>=1.0",  # required by inspect_ai's openai-api provider, used for
                    # OpenRouter, vLLM, and llama.cpp alike
    "inspect-evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals",
    # IFEval's scorer needs this; inspect_evals doesn't pull it in by default.
    "instruction_following_eval @ git+https://github.com/josejg/instruction_following_eval",
    # MATH's scorer needs this for symbolic/normalized answer matching;
    # inspect_evals doesn't declare it as a hard dependency either.
    "sympy>=1.12",
    # sympy.parsing.latex.parse_latex (used by the MATH scorer's
    # expression_exact_match_sympy metric) silently no-ops without this --
    # every ImportError from the missing parser falls through to a bare
    # `except Exception: return False`, so the metric reports 0.000 for
    # every sample rather than erroring. Verified: pinned to what sympy's
    # own error message asks for (version 4.11).
    "antlr4-python3-runtime==4.11.*",
    # SciCode hosts its test data on Google Drive and fetches it via
    # inspect_ai's gdrive_download, which raises PrerequisiteError without
    # this. Not declared by inspect_evals either.
    "gdown>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# lm-eval kept available as an independent cross-check when an Inspect score
# looks wrong; see "Why not the alternatives" in the plan.
crosscheck = ["lm-eval>=0.4.9"]

[project.scripts]
llm-bench = "llm_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_bench"]

[tool.hatch.metadata]
allow-direct-references = true
